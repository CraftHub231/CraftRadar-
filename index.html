<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>CraftRadar</title>
<style>
  :root {
    --sky1: #3a7bd5;
    --sky2: #8ec9ef;
    --grass: #5d9c3f;
    --grass-dk: #3f6b1f;
    --dirt: #7a4a26;
    --dirt-dk: #4f2f18;
    --panel: #322d28;
    --panel-lt: #423b34;
    --ink: #f4f0e8;
    --muted: #b3a99a;
    --gold: #f0b92d;
    --diamond: #57d8d0;
    --redstone: #d94a34;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, sans-serif;
    background: #1c1712;
    color: var(--ink);
    padding-bottom: 60px;
  }

  /* ---------- هدر ---------- */
  .hero {
    position: relative;
    height: 148px;
    background: linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 100%);
    overflow: hidden;
  }
  .cloud {
    position: absolute;
    background: rgba(255,255,255,0.92);
    border-radius: 40px;
  }
  .sun {
    position: absolute;
    top: 14px; left: 18px;
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 0 6px rgba(240,185,45,0.25);
  }
  .ground {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 26px;
    background: repeating-linear-gradient(90deg, var(--grass) 0 22px, var(--grass-dk) 22px 24px);
    border-bottom: 12px solid var(--dirt);
    box-shadow: 0 12px 0 -2px var(--dirt-dk) inset;
  }
  .hero-text {
    position: absolute;
    top: 50px; left: 0; right: 0;
    text-align: center;
    z-index: 2;
    padding: 0 16px;
  }
  .hero-text h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 0.5px;
    color: #fff;
    text-shadow: 2px 2px 0 var(--grass-dk);
  }
  .hero-text p {
    margin: 8px 0 0;
    font-size: 12.5px;
    color: #fff;
    opacity: 0.95;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.35);
  }

  /* ---------- تب‌ها ---------- */
  .tabbar {
    display: flex;
    gap: 6px;
    background: var(--panel);
    padding: 6px;
    margin: 0 12px;
    position: relative;
    top: -14px;
    border-radius: 16px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
    overflow-x: auto;
    z-index: 3;
  }
  .tab {
    flex: 1;
    min-width: 68px;
    text-align: center;
    padding: 10px 4px;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    background: var(--panel-lt);
    border-radius: 11px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s, color 0.15s;
  }
  .tab.active {
    background: var(--grass);
    color: #fff;
  }

  .wrap { padding: 4px 12px 16px; }
  .section { display: none; }
  .section.active { display: block; }

  /* ---------- کارت سرور ---------- */
  .card {
    background: var(--panel);
    border-radius: var(--radius);
    padding: 13px 14px;
    margin-bottom: 11px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.3);
  }
  .card-head { display: flex; align-items: center; gap: 11px; margin-bottom: 9px; }
  .avatar {
    width: 40px; height: 40px;
    border-radius: 11px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900;
    font-size: 15px;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  .card-titles { flex: 1; min-width: 0; }
  .card-titles .name { font-weight: 800; font-size: 14.5px; }
  .badge-row { display: flex; gap: 5px; margin-top: 4px; flex-wrap: wrap; }
  .badge {
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 20px;
  }
  .badge.cracked { background: rgba(93,156,63,0.25); color: #8fd66b; }
  .badge.votes { background: rgba(87,216,208,0.2); color: var(--diamond); }

  .ip-line {
    direction: ltr;
    text-align: left;
    font-family: 'SFMono-Regular', Consolas, monospace;
    background: #1e1a16;
    border-radius: 10px;
    padding: 8px 10px;
    margin-bottom: 8px;
    font-size: 13px;
    color: var(--diamond);
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .ip-line .hint { font-family: -apple-system, Tahoma; font-size: 10px; color: var(--muted); }

  .modes { font-size: 11.5px; color: var(--muted); line-height: 1.7; margin-bottom: 10px; }

  .btn-row { display: flex; gap: 8px; }
  .btn {
    flex: 1;
    padding: 9px 6px;
    font-size: 11.5px;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    color: #fff;
    transition: opacity 0.15s;
  }
  .btn:active { opacity: 0.75; }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn.status-btn { background: #4a4038; }
  .btn.vote-btn { background: var(--diamond); color: #06302c; }

  .status-box {
    margin-top: 9px;
    background: #1e1a16;
    border-radius: 10px;
    padding: 9px;
    font-size: 12px;
    white-space: pre-line;
    display: none;
  }

  /* ---------- بازی‌ها ---------- */
  .game-card {
    background: var(--panel);
    border-radius: var(--radius);
    padding: 20px 16px;
    text-align: center;
    margin-bottom: 14px;
  }
  .game-card h3 { margin: 0 0 4px; font-size: 15px; }
  .game-card .sub { font-size: 11.5px; color: var(--muted); margin-bottom: 16px; }

  .rps-row { display: flex; justify-content: center; gap: 10px; margin-bottom: 12px; }
  .rps-choice {
    width: 56px; height: 56px;
    font-size: 24px;
    background: var(--panel-lt);
    border-radius: 14px;
    cursor: pointer;
    border: none;
  }
  .rps-choice:active { transform: scale(0.94); }
  .rps-out { min-height: 50px; font-size: 13.5px; }
  .score-row { display: flex; justify-content: center; gap: 14px; font-size: 11px; color: var(--muted); margin-top: 10px; }
  .score-row b { color: var(--gold); }

  .guess-input {
    width: 96px;
    text-align: center;
    font-size: 22px;
    font-weight: 900;
    padding: 8px;
    border-radius: 12px;
    border: none;
    background: #1e1a16;
    color: var(--gold);
    margin-bottom: 10px;
  }
  .guess-out { font-size: 13px; min-height: 38px; margin-top: 8px; }
  .guess-tries { font-size: 10.5px; color: var(--muted); }
  .wide-btn { padding: 10px 20px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; color: #fff; }

  /* ---------- برترین‌ها ---------- */
  .rank-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--panel);
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .rank-num {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--gold);
    color: #3a2a00;
    display: flex; align-items: center; justify-content: center;
    font-size: 11.5px; font-weight: 900;
    flex-shrink: 0;
  }
  .rank-row .name { flex: 1; font-size: 13px; font-weight: 700; }
  .rank-row .count { font-size: 11.5px; color: var(--diamond); }
  .empty-note {
    background: var(--panel);
    border-radius: var(--radius);
    padding: 22px;
    text-align: center;
    color: var(--muted);
    font-size: 12.5px;
  }

  .toast {
    position: fixed;
    bottom: 16px; left: 50%; transform: translateX(-50%);
    background: var(--grass);
    color: #fff;
    padding: 10px 18px;
    border-radius: 24px;
    font-size: 12.5px;
    font-weight: 800;
    display: none;
    z-index: 50;
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
  }

  .boot-error {
    margin: 16px 12px;
    background: var(--panel);
    border-radius: var(--radius);
    padding: 16px;
    color: #ff9d8a;
    font-size: 12.5px;
    direction: ltr;
    text-align: left;
  }
</style>
</head>
<body>

<div class="hero">
  <div class="sun"></div>
  <div class="cloud" style="width:36px;height:16px;top:16px;left:55%;"></div>
  <div class="cloud" style="width:26px;height:12px;top:24px;left:70%;"></div>
  <div class="hero-text">
    <h1>CraftRadar</h1>
    <p>رادار پیدا کردن سرورهای ماینکرفت ⛏️</p>
  </div>
  <div class="ground"></div>
</div>

<div class="tabbar" id="tabbar">
  <div class="tab active" data-tab="iran">🇮🇷 ایران</div>
  <div class="tab" data-tab="foreign">🌍 خارجی</div>
  <div class="tab" data-tab="top">🏆 برترین‌ها</div>
  <div class="tab" data-tab="games">🎮 بازی‌ها</div>
</div>

<div class="wrap">
  <div class="section active" id="sec-iran"><div id="list-iran"></div></div>
  <div class="section" id="sec-foreign"><div id="list-foreign"></div></div>
  <div class="section" id="sec-top"><div id="list-top"></div></div>

  <div class="section" id="sec-games">
    <div class="game-card">
      <h3>سنگ کاغذ قیچی</h3>
      <div class="sub">یه دست مسابقه با CraftRadar</div>
      <div class="rps-row">
        <button class="rps-choice" data-c="🪨">🪨</button>
        <button class="rps-choice" data-c="📄">📄</button>
        <button class="rps-choice" data-c="✂️">✂️</button>
      </div>
      <div class="rps-out" id="rps-out">یکی از گزینه‌ها رو انتخاب کن...</div>
      <div class="score-row">
        <span>برد: <b id="rps-win">0</b></span>
        <span>باخت: <b id="rps-lose">0</b></span>
        <span>مساوی: <b id="rps-draw">0</b></span>
      </div>
    </div>

    <div class="game-card">
      <h3>حدس عدد</h3>
      <div class="sub">یه عدد بین ۱ تا ۱۰۰ حدس بزن</div>
      <input type="number" class="guess-input" id="guess-input" placeholder="؟" min="1" max="100">
      <br>
      <button class="wide-btn" style="background:var(--diamond);color:#06302c;" id="guess-submit">حدس بزن</button>
      <div class="guess-out" id="guess-msg">آماده‌ای؟</div>
      <div class="guess-tries" id="guess-tries"></div>
      <br>
      <button class="wide-btn" style="background:var(--panel-lt);" id="guess-restart">🔁 بازی جدید</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div id="boot-error-holder"></div>

<script>
try {

var SERVERS = {
  iran: [
    { name: "GunMax", ip: "play.gunmax.org", mode: "Survival, Roleplay, SkyMine, BedWars" },
    { name: "GameUp", ip: "mc.gameup.ir", mode: "Survival, SkyBlock, BedWars, Creative, Economy, Factions" },
    { name: "Xcraft", ip: "play.xcraft.ir", mode: "Survival, SMP, SkyBlock, Practice, Parkour, SkyMine, Creative, BedWars" },
    { name: "RexoCraft", ip: "play.rexocraft.com", mode: "BedWars, Survival, SkyMine, SkyBlock, ThePit, Arcade" },
    { name: "Iran Minecraft", ip: "play.iranminecraft.com", mode: "Survival, SkyBlock, BedWars, Hunger Games, Minigames" },
    { name: "TrexMine", ip: "play.trexmine.com", mode: "Survival, SkyBlock, BedWars, PvP, Minigames" },
    { name: "MagicPixel", ip: "play.magicpixel.ir", mode: "Roleplay, RPG, SkyMine, SMP" },
    { name: "InfinityStar", ip: "play.infinitystar.ir", mode: "Roleplay, Survival, SMP" },
    { name: "HorizonNetwork", ip: "play.horizonnetwork.ir", mode: "SkyMine, SMP, ThePit, Survival" },
    { name: "St Abad", ip: "play.stabad.ir", mode: "Survival, Practice" },
    { name: "LunarProCraft", ip: "play.lunarprocraft.ir", mode: "OneBlock, Minigames, BedWars" },
    { name: "ArianCraft", ip: "play.svariancraft.ir", mode: "BedWars, OneBlock, SkyBlock, Survival, Practice, Parkour" },
    { name: "SUSIS MC", ip: "play.susismc.ir", mode: "Survival, SMP, Anarchy, Zombie" },
    { name: "MineShard", ip: "mc.mineshard.top", mode: "PracticePvP, Bridge Training" },
    { name: "OnyxMine", ip: "play.onyx-mc.ir", mode: "Survival و حالت‌های مختلف" },
    { name: "VoidShot", ip: "play.voidshot.ir", mode: "Roleplay, BedWars, SkyBlock, Survival" },
    { name: "PaladinGuard", ip: "java.paladinguard.ir", mode: "Survival, Roleplay, SMP, Bedrock" },
    { name: "PandaSMP", ip: "play.pandasmp.ir", mode: "Lifesteal, SMP, Anarchy" },
    { name: "ColdGame", ip: "play.coldgame.ir", mode: "Survival, SlimeFun, SkyMine, Practice" },
    { name: "BitCraft", ip: "play.bitonetop.com", mode: "Survival, PvP, Economy" },
    { name: "RubyLand", ip: "play.mcbe.ir", mode: "Bedrock Survival, Economy, Roleplay" }
  ],
  foreign: [
    { name: "Pika Network", ip: "play.pika-network.net", mode: "BedWars, SkyBlock, Factions, Lifesteal, Prison, Survival, OneBlock, KitPvP", status: "Cracked" },
    { name: "JartexNetwork", ip: "play.jartexnetwork.com", mode: "BedWars, SkyWars, Survival, Prison, SkyBlock, Factions, PvP", status: "Cracked" },
    { name: "MineBerry", ip: "mc.mineberry.org", mode: "Survival, Anarchy, Economy, Factions, KitPvP, Minigames, PvP", status: "Cracked" },
    { name: "HylexMC", ip: "play.hylexmc.net", mode: "BedWars, Lifesteal, OneBlock, Parkour, PvP", status: "Cracked" },
    { name: "Twerion", ip: "twerion.net", mode: "BedWars, SkyBlock, PvP, Minigames, CityBuild", status: "Cracked" },
    { name: "AppleMC", ip: "play.applemc.fun", mode: "Survival, BedWars, Earth, Lifesteal, Economy, PvP", status: "Cracked" },
    { name: "UltimisMC", ip: "play.ultimismc.com", mode: "Survival, BedWars, Lifesteal, OneBlock, Parkour, PvP", status: "Cracked" },
    { name: "LifestealSMP", ip: "play.lifestealsmp.com", mode: "Survival, Lifesteal, Earth, Factions, PvP, Minigames", status: "Cracked" },
    { name: "6b6t", ip: "play.6b6t.org", mode: "Anarchy, Survival, PvP", status: "Cracked" },
    { name: "OneBlocky", ip: "play.oneblocky.com", mode: "OneBlock, SkyBlock, Survival, Economy, PvP", status: "Cracked" }
  ]
};

var AVATAR_COLORS = ["#5d9c3f", "#57d8d0", "#f0b92d", "#d94a34", "#7a4a26", "#5b7fd9"];
function avatarStyle(name) {
  var sum = 0;
  for (var i = 0; i < name.length; i++) sum += name.charCodeAt(i);
  var color = AVATAR_COLORS[sum % AVATAR_COLORS.length];
  var letters = name.replace(/[^A-Za-z\u0600-\u06FF]/g, "").slice(0, 2).toUpperCase() || "MC";
  return { color: color, letters: letters };
}

/* ---------- رأی‌ها (localStorage) ---------- */
function safeGet(key, fallback) {
  try {
    var v = localStorage.getItem(key);
    return v ? JSON.parse(v) : fallback;
  } catch (e) { return fallback; }
}
function safeSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
}

var votes = safeGet("craftradar_votes", {});
var votedServers = safeGet("craftradar_voted", []);

function getVotes(name) { return votes[name] || 0; }
function hasVoted(name) { return votedServers.indexOf(name) !== -1; }
function addVote(name) {
  if (hasVoted(name)) return null;
  votes[name] = (votes[name] || 0) + 1;
  safeSet("craftradar_votes", votes);
  votedServers.push(name);
  safeSet("craftradar_voted", votedServers);
  return votes[name];
}

/* ---------- توست ---------- */
function showToast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = "block";
  setTimeout(function () { t.style.display = "none"; }, 1300);
}
function copyIp(ip) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(ip).catch(function () {});
  }
  showToast("کپی شد: " + ip);
}

/* ---------- وضعیت زنده ---------- */
function checkStatus(ip, outEl, btn) {
  outEl.style.display = "block";
  outEl.textContent = "در حال بررسی...";
  btn.disabled = true;
  var cleanIp = ip.split("/")[0].trim();

  fetch("https://api.mcsrvstat.us/3/" + cleanIp)
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (data.online) {
        outEl.textContent =
          "🟢 آنلاین (Java)\n" +
          "🌐 IP عددی: " + (data.ip || "?") + "\n" +
          "👥 پلیر: " + (data.players ? data.players.online : "?") + "/" + (data.players ? data.players.max : "?") + "\n" +
          "🧱 نسخه: " + (data.version || "?");
        btn.disabled = false;
        return;
      }
      return fetch("https://api.mcsrvstat.us/bedrock/3/" + cleanIp)
        .then(function (r) { return r.json(); })
        .then(function (data2) {
          if (data2.online) {
            outEl.textContent =
              "🟢 آنلاین (Bedrock)\n" +
              "🌐 IP عددی: " + (data2.ip || "?") + "\n" +
              "👥 پلیر: " + (data2.players ? data2.players.online : "?") + "/" + (data2.players ? data2.players.max : "?");
          } else {
            outEl.textContent = "🔴 آفلاین یا در دسترس نیست";
          }
          btn.disabled = false;
        });
    })
    .catch(function () {
      outEl.textContent = "⚠️ خطا در بررسی وضعیت (اتصال اینترنت رو چک کن)";
      btn.disabled = false;
    });
}

/* ---------- رندر لیست ---------- */
function renderList(category, containerId) {
  var list = document.getElementById(containerId);
  list.innerHTML = "";
  SERVERS[category].forEach(function (s) {
    var av = avatarStyle(s.name);
    var card = document.createElement("div");
    card.className = "card";
    card.innerHTML =
      '<div class="card-head">' +
        '<div class="avatar" style="background:' + av.color + '">' + av.letters + '</div>' +
        '<div class="card-titles">' +
          '<div class="name">' + s.name + '</div>' +
          '<div class="badge-row">' +
            (s.status ? '<span class="badge cracked">' + s.status + '</span>' : '') +
            '<span class="badge votes votes-badge">🗳️ ' + getVotes(s.name) + '</span>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="ip-line"><span>' + s.ip + '</span><span class="hint">کپی</span></div>' +
      '<div class="modes">' + s.mode + '</div>' +
      '<div class="btn-row">' +
        '<button class="btn status-btn">📡 وضعیت</button>' +
        '<button class="btn vote-btn">🗳️ رأی</button>' +
      '</div>' +
      '<div class="status-box"></div>';

    card.querySelector(".ip-line").onclick = function () { copyIp(s.ip); };

    var statusBtn = card.querySelector(".status-btn");
    var outEl = card.querySelector(".status-box");
    statusBtn.onclick = function () { checkStatus(s.ip, outEl, statusBtn); };

    var voteBtn = card.querySelector(".vote-btn");
    var votesBadge = card.querySelector(".votes-badge");
    if (hasVoted(s.name)) {
      voteBtn.textContent = "✅ رأی دادی";
      voteBtn.disabled = true;
    }
    voteBtn.onclick = function () {
      var newTotal = addVote(s.name);
      if (newTotal === null) {
        showToast("قبلاً به " + s.name + " رأی دادی");
        return;
      }
      votesBadge.textContent = "🗳️ " + newTotal;
      voteBtn.textContent = "✅ رأی دادی";
      voteBtn.disabled = true;
      showToast("به " + s.name + " رأی دادی!");
    };

    list.appendChild(card);
  });
}

function renderTop() {
  var all = SERVERS.iran.concat(SERVERS.foreign);
  var sorted = all.slice().sort(function (a, b) { return getVotes(b.name) - getVotes(a.name); });
  var list = document.getElementById("list-top");
  list.innerHTML = "";

  var anyVotes = sorted.some(function (s) { return getVotes(s.name) > 0; });
  if (!anyVotes) {
    list.innerHTML = '<div class="empty-note">هنوز کسی رأی نداده! برو تو تب سرورها و اولین نفر باش 🚀</div>';
    return;
  }
  sorted.slice(0, 10).forEach(function (s, i) {
    var row = document.createElement("div");
    row.className = "rank-row";
    row.innerHTML =
      '<div class="rank-num">' + (i + 1) + '</div>' +
      '<div class="name">' + s.name + '</div>' +
      '<div class="count">🗳️ ' + getVotes(s.name) + ' رأی</div>';
    list.appendChild(row);
  });
}

/* ---------- تب‌ها ---------- */
var tabs = document.querySelectorAll(".tab");
for (var i = 0; i < tabs.length; i++) {
  tabs[i].onclick = function () {
    var target = this.getAttribute("data-tab");
    var allTabs = document.querySelectorAll(".tab");
    for (var j = 0; j < allTabs.length; j++) allTabs[j].classList.remove("active");
    var allSections = document.querySelectorAll(".section");
    for (var k = 0; k < allSections.length; k++) allSections[k].classList.remove("active");
    this.classList.add("active");
    document.getElementById("sec-" + target).classList.add("active");
    if (target === "top") renderTop();
  };
}
