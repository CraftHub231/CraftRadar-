<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>CraftRadar</title>
<script src="https://tapi.bale.ai/miniapp.js?3"></script>
<style>
  :root {
    --bg: #0b1219;
    --bg2: #0f1720;
    --card: #16212c;
    --card2: #1c2a37;
    --accent: #4ade80;
    --accent2: #f97316;
    --accent3: #38bdf8;
    --text: #e5e7eb;
    --muted: #8b98a5;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    font-family: Tahoma, sans-serif;
    background: radial-gradient(circle at 30% 0%, #17303f 0%, var(--bg) 55%);
    color: var(--text);
    min-height: 100vh;
  }
  body { padding: 14px 12px 90px; }

  /* ---------- هدر ---------- */
  .hero {
    text-align: center;
    padding: 18px 10px 22px;
    position: relative;
    overflow: hidden;
    border-radius: 18px;
    background: linear-gradient(135deg, #16212c 0%, #0f1a24 100%);
    margin-bottom: 16px;
    border: 1px solid #223140;
  }
  .hero::before {
    content: "";
    position: absolute;
    inset: -40%;
    background: radial-gradient(circle, rgba(74,222,128,0.18) 0%, transparent 65%);
    animation: pulse 4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.7; }
    50% { transform: scale(1.15); opacity: 1; }
  }
  .hero h1 {
    position: relative;
    margin: 0;
    font-size: 22px;
    letter-spacing: 0.5px;
  }
  .hero p {
    position: relative;
    margin: 6px 0 0;
    font-size: 12.5px;
    color: var(--muted);
  }

  /* ---------- تب‌ها ---------- */
  .tabs {
    display: flex;
    gap: 6px;
    background: var(--card);
    padding: 5px;
    border-radius: 14px;
    margin-bottom: 14px;
    position: sticky;
    top: 8px;
    z-index: 10;
    overflow-x: auto;
  }
  .tab {
    flex: 1;
    min-width: 70px;
    padding: 9px 4px;
    text-align: center;
    border-radius: 10px;
    cursor: pointer;
    font-size: 12.5px;
    color: var(--muted);
    transition: all 0.2s;
    white-space: nowrap;
  }
  .tab.active {
    background: linear-gradient(135deg, var(--accent), #22c55e);
    color: #06210f;
    font-weight: bold;
  }

  .section { display: none; animation: fadein 0.25s ease; }
  .section.active { display: block; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: translateY(0);} }

  /* ---------- کارت سرور ---------- */
  .card {
    background: var(--card);
    border-radius: 14px;
    padding: 13px 14px;
    margin-bottom: 10px;
    border: 1px solid #1f2c38;
  }
  .card-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: bold;
    font-size: 14.5px;
  }
  .badges { display: flex; gap: 6px; align-items: center; }
  .badge {
    font-size: 10.5px;
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: bold;
  }
  .badge.premium { background: var(--accent2); color: #1a0f00; }
  .badge.cracked { background: #22c55e33; color: var(--accent); border: 1px solid var(--accent); }
  .badge.votes { background: #38bdf822; color: var(--accent3); border: 1px solid var(--accent3); }

  .ip {
    direction: ltr;
    text-align: left;
    font-family: monospace;
    background: #0a1319;
    padding: 7px 9px;
    border-radius: 8px;
    margin: 8px 0;
    font-size: 13px;
    color: var(--accent);
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .ip span.hint { font-size: 10px; color: var(--muted); font-family: Tahoma; }
  .modes { font-size: 11.5px; color: var(--muted); margin-bottom: 10px; line-height: 1.6; }

  .row-btns { display: flex; gap: 8px; }
  .btn {
    flex: 1;
    padding: 9px;
    border: none;
    border-radius: 9px;
    font-size: 12.5px;
    cursor: pointer;
    font-weight: bold;
  }
  .btn.status { background: #24333f; color: var(--text); }
  .btn.vote { background: var(--accent3); color: #061621; }
  .status-result {
    margin-top: 8px;
    font-size: 12.5px;
    white-space: pre-line;
    background: #0a1319;
    padding: 8px;
    border-radius: 8px;
    display: none;
  }

  /* ---------- بازی‌ها ---------- */
  .game-card {
    background: var(--card);
    border-radius: 16px;
    padding: 18px;
    text-align: center;
    margin-bottom: 14px;
    border: 1px solid #1f2c38;
  }
  .game-title { font-size: 15px; font-weight: bold; margin-bottom: 4px; }
  .game-sub { font-size: 12px; color: var(--muted); margin-bottom: 14px; }

  .rps-options { display: flex; justify-content: center; gap: 12px; margin: 10px 0; }
  .rps-btn {
    font-size: 30px;
    background: var(--card2);
    border: 2px solid #223140;
    border-radius: 16px;
    width: 68px;
    height: 68px;
    cursor: pointer;
    transition: transform 0.15s;
  }
  .rps-btn:active { transform: scale(0.9); }
  .rps-result { min-height: 60px; font-size: 14px; margin-top: 10px; }
  .score-bar {
    display: flex;
    justify-content: center;
    gap: 14px;
    font-size: 12px;
    color: var(--muted);
    margin-top: 8px;
  }
  .score-bar b { color: var(--text); }

  .guess-input {
    width: 100px;
    text-align: center;
    font-size: 20px;
    padding: 8px;
    border-radius: 10px;
    border: 2px solid var(--accent3);
    background: #0a1319;
    color: var(--text);
    margin: 10px 0;
  }
  .guess-msg { font-size: 13.5px; min-height: 40px; margin-top: 6px; }
  .guess-tries { font-size: 11.5px; color: var(--muted); }

  /* ---------- برترین‌ها ---------- */
  .top-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card);
    padding: 10px 12px;
    border-radius: 12px;
    margin-bottom: 8px;
  }
  .rank {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--card2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: bold;
    color: var(--accent);
    flex-shrink: 0;
  }
  .top-item .name { flex: 1; font-size: 13.5px; }
  .top-item .count { font-size: 12px; color: var(--accent3); }

  .toast {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent);
    color: #06210f;
    padding: 9px 18px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
    display: none;
    z-index: 50;
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
  }
</style>
</head>
<body>

<div class="hero">
  <h1>📡 CraftRadar</h1>
  <p>رادار پیدا کردن سرورهای ماینکرفت 🎮</p>
</div>

<div class="tabs">
  <div class="tab active" data-tab="iran">🇮🇷 ایران</div>
  <div class="tab" data-tab="foreign">🌍 خارجی</div>
  <div class="tab" data-tab="top">🏆 برترین‌ها</div>
  <div class="tab" data-tab="games">🎮 بازی‌ها</div>
</div>

<div class="section active" id="sec-iran"><div id="list-iran"></div></div>
<div class="section" id="sec-foreign"><div id="list-foreign"></div></div>
<div class="section" id="sec-top"><div id="list-top"></div></div>

<div class="section" id="sec-games">
  <div class="game-card">
    <div class="game-title">🪨📄✂️ سنگ کاغذ قیچی</div>
    <div class="game-sub">با CraftRadar مسابقه بده!</div>
    <div class="rps-options">
      <div class="rps-btn" data-c="🪨">🪨</div>
      <div class="rps-btn" data-c="📄">📄</div>
      <div class="rps-btn" data-c="✂️">✂️</div>
    </div>
    <div class="rps-result" id="rps-result">یکی از گزینه‌ها رو انتخاب کن...</div>
    <div class="score-bar">
      <span>🏆 برد: <b id="rps-win">0</b></span>
      <span>💀 باخت: <b id="rps-lose">0</b></span>
      <span>🤝 مساوی: <b id="rps-draw">0</b></span>
    </div>
  </div>

  <div class="game-card">
    <div class="game-title">🔢 حدس عدد</div>
    <div class="game-sub">یه عدد بین ۱ تا ۱۰۰ حدس بزن</div>
    <input type="number" class="guess-input" id="guess-input" placeholder="؟" min="1" max="100">
    <br>
    <button class="btn vote" style="width:120px;margin-top:6px;" id="guess-submit">حدس بزن</button>
    <div class="guess-msg" id="guess-msg">آماده‌ای؟</div>
    <div class="guess-tries" id="guess-tries"></div>
    <button class="btn status" style="width:120px;margin-top:10px;" id="guess-restart">🔁 بازی جدید</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SERVERS = {
  iran: [
    { name: "GunMax", ip: "play.gunmax.org", mode: "Survival, Roleplay, SkyMine, BedWars" },
    { name: "GameUp", ip: "mc.gameup.ir", mode: "Survival, SkyBlock, BedWars, Creative, Economy, Factions" },
    { name: "Xcraft", ip: "play.xcraft.ir", mode: "Survival, SMP, SkyBlock, Practice, Parkour, SkyMine, Creative, BedWars" },
    { name: "RexoCraft", ip: "play.rexocraft.com", mode: "BedWars, Survival, SkyMine, SkyBlock, ThePit, Arcade" },
    { name: "Iran Minecraft", ip: "play.iranminecraft.com", mode: "Survival, SkyBlock, BedWars, Hunger Games, Minigames" },
    { name: "TrexMine", ip: "play.trexmine.com", mode: "Survival, SkyBlock, BedWars, PvP, Minigames" },
    { name: "MagicPixel", ip: "play.magicpixel.ir", mode: "Roleplay, RPG, SkyMine, SMP" },
    { name: "InfinityStar", ip: "play.infinitystar.ir", mode: "Roleplay, Survival, SMP" },
    { name: "HorizonNetwork", ip: "play.horizonnetwork.ir", mode: "SkyMine, SMP, ThePit, Survival" },
    { name: "St Abad", ip: "play.stabad.ir", mode: "Survival, Practice" },
    { name: "LunarProCraft", ip: "play.lunarprocraft.ir", mode: "OneBlock, Minigames, BedWars" },
    { name: "ArianCraft", ip: "play.svariancraft.ir", mode: "BedWars, OneBlock, SkyBlock, Survival, Practice, Parkour" },
    { name: "SUSIS MC", ip: "play.susismc.ir", mode: "Survival, SMP, Anarchy, Zombie" },
    { name: "MineShard", ip: "mc.mineshard.top", mode: "PracticePvP, Bridge Training" },
    { name: "OnyxMine", ip: "play.onyx-mc.ir", mode: "Survival و حالت‌های مختلف" },
    { name: "VoidShot", ip: "play.voidshot.ir", mode: "Roleplay, BedWars, SkyBlock, Survival" },
    { name: "PaladinGuard", ip: "java.paladinguard.ir", mode: "Survival, Roleplay, SMP, Bedrock" },
    { name: "PandaSMP", ip: "play.pandasmp.ir", mode: "Lifesteal, SMP, Anarchy" },
  ],
  foreign: [
    { name: "Pika Network", ip: "play.pika-network.net", mode: "BedWars, SkyBlock, Factions, Lifesteal, Prison, Survival, OneBlock, KitPvP", status: "Cracked" },
    { name: "JartexNetwork", ip: "play.jartexnetwork.com", mode: "BedWars, SkyWars, Survival, Prison, SkyBlock, Factions, PvP", status: "Cracked" },
    { name: "MineBerry", ip: "mc.mineberry.org", mode: "Survival, Anarchy, Economy, Factions, KitPvP, Minigames, PvP", status: "Cracked" },
    { name: "HylexMC", ip: "play.hylexmc.net", mode: "BedWars, Lifesteal, OneBlock, Parkour, PvP", status: "Cracked" },
    { name: "Twerion", ip: "twerion.net", mode: "BedWars, SkyBlock, PvP, Minigames, CityBuild", status: "Cracked" },
    { name: "AppleMC", ip: "play.applemc.fun", mode: "Survival, BedWars, Earth, Lifesteal, Economy, PvP", status: "Cracked" },
    { name: "UltimisMC", ip: "play.ultimismc.com", mode: "Survival, BedWars, Lifesteal, OneBlock, Parkour, PvP", status: "Cracked" },
    { name: "LifestealSMP", ip: "play.lifestealsmp.com", mode: "Survival, Lifesteal, Earth, Factions, PvP, Minigames", status: "Cracked" },
    { name: "6b6t", ip: "play.6b6t.org", mode: "Anarchy, Survival, PvP", status: "Cracked" },
    { name: "OneBlocky", ip: "play.oneblocky.com", mode: "OneBlock, SkyBlock, Survival, Economy, PvP", status: "Cracked" },
  ]
};

// ==================== رأی‌ها (فقط روی همین گوشی) ====================
function loadVotes() {
  try { return JSON.parse(localStorage.getItem("craftradar_votes") || "{}"); }
  catch (e) { return {}; }
}
function saveVotes(v) { localStorage.setItem("craftradar_votes", JSON.stringify(v)); }
let votes = loadVotes();

function getVotes(name) { return votes[name] || 0; }
function addVote(name) {
  votes[name] = (votes[name] || 0) + 1;
  saveVotes(votes);
}

// ==================== توست ====================
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = "block";
  setTimeout(() => (t.style.display = "none"), 1300);
}
function copyIp(ip) {
  navigator.clipboard?.writeText(ip).catch(() => {});
  showToast("📋 کپی شد: " + ip);
}

// ==================== وضعیت زنده‌ی سرور ====================
async function checkStatus(ip, resultEl, btn) {
  resultEl.style.display = "block";
  resultEl.textContent = "⏳ در حال بررسی...";
  btn.disabled = true;
  const cleanIp = ip.split("/")[0].trim();
  try {
    let res = await fetch(`https://api.mcsrvstat.us/3/${cleanIp}`);
    let data = await res.json();
    if (data.online) {
      resultEl.textContent = `🟢 آنلاین (Java) | 👥 ${data.players?.online ?? "?"}/${data.players?.max ?? "?"} | 🧱 ${data.version ?? "?"}`;
      btn.disabled = false;
      return;
    }
    res = await fetch(`https://api.mcsrvstat.us/bedrock/3/${cleanIp}`);
    data = await res.json();
    if (data.online) {
      resultEl.textContent = `🟢 آنلاین (Bedrock) | 👥 ${data.players?.online ?? "?"}/${data.players?.max ?? "?"}`;
      btn.disabled = false;
      return;
    }
    resultEl.textContent = "🔴 آفلاین یا در دسترس نیست";
  } catch (e) {
    resultEl.textContent = "⚠️ خطا در بررسی وضعیت";
  }
  btn.disabled = false;
}

// ==================== رندر لیست سرور ====================
function renderList(category, containerId) {
  const list = document.getElementById(containerId);
  list.innerHTML = "";
  SERVERS[category].forEach((s) => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="card-title">
        <span>🎮 ${s.name}</span>
        <div class="badges">
          ${s.status ? `<span class="badge cracked">${s.status}</span>` : ""}
          <span class="badge votes">🗳️ ${getVotes(s.name)}</span>
        </div>
      </div>
      <div class="ip">${s.ip} <span class="hint">کپی</span></div>
      <div class="modes">${s.mode}</div>
      <div class="row-btns">
        <button class="btn status">📡 وضعیت</button>
        <button class="btn vote">🗳️ رأی بده</button>
      </div>
      <div class="status-result"></div>
    `;
    card.querySelector(".ip").onclick = () => copyIp(s.ip);
    const statusBtn = card.querySelector(".btn.status");
    const resultEl = card.querySelector(".status-result");
    statusBtn.onclick = () => checkStatus(s.ip, resultEl, statusBtn);

    const voteBtn = card.querySelector(".btn.vote");
    const votesBadge = card.querySelector(".badge.votes");
    voteBtn.onclick = () => {
      addVote(s.name);
      votesBadge.textContent = `🗳️ ${getVotes(s.name)}`;
      showToast(`🗳️ به ${s.name} رأی دادی!`);
      if (document.querySelector('.tab[data-tab="top"]').classList.contains("active-loaded")) {
        renderTop();
      }
    };
    list.appendChild(card);
  });
}

function renderTop() {
  const all = [...SERVERS.iran, ...SERVERS.foreign];
  const sorted = [...all].sort((a, b) => getVotes(b.name) - getVotes(a.name));
  const list = document.getElementById("list-top");
  list.innerHTML = "";
  sorted.slice(0, 10).forEach((s, i) => {
    const item = document.createElement("div");
    item.className = "top-item";
    item.innerHTML = `
      <div class="rank">${i + 1}</div>
      <div class="name">🎮 ${s.name}</div>
      <div class="count">🗳️ ${getVotes(s.name)} رأی</div>
    `;
    list.appendChild(item);
  });
  if (sorted.every(s => getVotes(s.name) === 0)) {
    list.innerHTML = `<div style="text-align:center;color:var(--muted);padding:20px;font-size:13px;">هنوز کسی رأی نداده! برو تو تب سرورها و اولین نفر باش 🚀</div>`;
  }
}

// ==================== تب‌ها ====================
document.querySelectorAll(".tab").forEach((tab) => {
  tab.onclick = () => {
    document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
    document.querySelectorAll(".section").forEach((s) => s.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById("sec-" + tab.dataset.tab).classList.add("active");
    if (tab.dataset.tab === "top") renderTop();
  };
});

renderList("iran", "list-iran");
renderList("foreign", "list-foreign");

// ==================== بازی سنگ کاغذ قیچی ====================
function loadRpsScore() {
  try { return JSON.parse(localStorage.getItem("craftradar_rps") || '{"win":0,"lose":0,"draw":0}'); }
  catch (e) { return { win: 0, lose: 0, draw: 0 }; }
}
let rpsScore = loadRpsScore();
function saveRpsScore() { localStorage.setItem("craftradar_rps", JSON.stringify(rpsScore)); }
function updateRpsUI() {
  document.getElementById("rps-win").textContent = rpsScore.win;
  document.getElementById("rps-lose").textContent = rpsScore.lose;
  document.getElementById("rps-draw").textContent = rpsScore.draw;
}
updateRpsUI();

document.querySelectorAll(".rps-btn").forEach((btn) => {
  btn.onclick = () => {
    const options = ["🪨", "📄", "✂️"];
    const user = btn.dataset.c;
    const bot = options[Math.floor(Math.random() * 3)];
    let result;
    if (user === bot) {
      result = "🤝 مساوی شد!";
      rpsScore.draw++;
    } else if (
      (user === "🪨" && bot === "✂️") ||
      (user === "📄" && bot === "🪨") ||
      (user === "✂️" && bot === "📄")
    ) {
      result = "🎉 بردی!";
      rpsScore.win++;
    } else {
      result = "😢 باختی!";
      rpsScore.lose++;
    }
    document.getElementById("rps-result").innerHTML = `تو: ${user} &nbsp;|&nbsp; CraftRadar: ${bot}<br><b>${result}</b>`;
    saveRpsScore();
    updateRpsUI();
  };
});

// ==================== بازی حدس عدد ====================
let secretNumber = Math.floor(Math.random() * 100) + 1;
let tries = 0;

function checkGuess() {
  const input = document.getElementById("guess-input");
  const val = parseInt(input.value);
  const msg = document.getElementById("guess-msg");
  const triesEl = document.getElementById("guess-tries");
  if (!val || val < 1 || val > 100) {
    msg.textContent = "یه عدد بین ۱ تا ۱۰۰ بزن!";
    return;
  }
  tries++;
  if (val < secretNumber) {
    msg.textContent = "⬆️ بزرگ‌تره!";
  } else if (val > secretNumber) {
    msg.textContent = "⬇️ کوچیک‌تره!";
  } else {
    msg.textContent = `🎉 آفرین! عدد ${secretNumber} بود.`;
  }
  triesEl.textContent = `تعداد تلاش: ${tries}`;
}

document.getElementById("guess-submit").onclick = checkGuess;
document.getElementById("guess-input").addEventListener("keypress", (e) => {
  if (e.key === "Enter") checkGuess();
});
document.getElementById("guess-restart").onclick = () => {
  secretNumber = Math.floor(Math.random() * 100) + 1;
  tries = 0;
  document.getElementById("guess-input").value = "";
  document.getElementById("guess-msg").textContent = "بازی جدید شروع شد! حدس بزن.";
  document.getElementById("guess-tries").textContent = "";
};

// ==================== آماده‌سازی مینی‌اپ بله ====================
if (window.Bale && window.Bale.WebApp) {
  window.Bale.WebApp.ready();
  window.Bale.WebApp.expand();
}
</script>
</body>
</html>
